<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="hero">
      <svg class="hero-whistle" width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="86" cy="58" r="7" fill="none" stroke="#A0A8B0" stroke-width="3.5"/>
        <path d="M54 48 L78 50 C82 50.5, 84 53, 84 58 C84 63, 82 65, 78 65.5 L54 68" fill="#B0B8C4" stroke="#8890A0" stroke-width="1.5"/>
        <rect x="8" y="40" width="50" height="34" rx="5" fill="#C0C8D4" stroke="#8890A0" stroke-width="1.5"/>
        <rect x="8" y="40" width="50" height="12" rx="5" fill="#E0E8F0" opacity=".25"/>
        <rect x="6" y="54" width="50" height="7" rx="3" fill="#3a4250"/>
        <circle cx="26" cy="34" r="10" fill="white" stroke="#ccc" stroke-width="1.5"/>
        <circle cx="28.5" cy="34" r="6" fill="#1a1a1a"/>
        <circle cx="30" cy="31.5" r="2.5" fill="white"/>
        <circle cx="44" cy="34" r="10" fill="white" stroke="#ccc" stroke-width="1.5"/>
        <circle cx="46.5" cy="34" r="6" fill="#1a1a1a"/>
        <circle cx="48" cy="31.5" r="2.5" fill="white"/>
      </svg>
      <h1>Prompt Coach</h1>
      <p class="tagline">Your AI prompting sideline coach</p>
    </div>

    <div class="card">
      <label for="provider">Mode</label>
      <select id="provider">
        <option value="demo">Demo Mode (no API key needed)</option>
        <option value="openai">OpenAI (GPT-4o-mini)</option>
        <option value="anthropic">Anthropic (Claude Sonnet)</option>
      </select>

      <div id="apiSection" style="display:none">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-… or sk-ant-…">
        <p class="hint">Stored locally. Never leaves your machine.</p>
      </div>

      <button id="save" class="btn-primary">Save Settings</button>
      <div id="status" class="status" role="status"></div>
    </div>

    <div class="card how">
      <h2>How to Use</h2>
      <div class="row">
        <kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>P</kbd>
        <span class="desc">Activate the coach</span>
      </div>
      <div class="row">
        <span class="icon">🏟</span>
        <span class="desc">Or click the whistle near any prompt field</span>
      </div>
    </div>

    <div class="card">
      <h2>Supported Platforms</h2>
      <div class="chips">
        <span class="chip">ChatGPT</span>
        <span class="chip">Claude</span>
        <span class="chip">Gemini</span>
        <span class="chip">Perplexity</span>
        <span class="chip">Copilot</span>
      </div>
    </div>

    <div class="card">
      <button id="resetOnboarding" class="btn-secondary">Replay Onboarding Tour</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
