<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="hero">
      <svg class="hero-whistle" width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M58 18 C63 4, 76 4, 72 18" stroke="#1B6B3E" fill="none" stroke-width="3" stroke-linecap="round"/>
        <circle cx="65" cy="15" r="4.5" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
        <path d="M12 40 C8 40, 5 44, 5 52 C5 60, 8 64, 12 64 L68 64 C76 64, 80 60, 80 52 C80 44, 76 40, 68 40 Z" fill="#D4D4D8" stroke="#A1A1AA" stroke-width="1.5"/>
        <path d="M76 45 L92 45 C95 45, 97 47, 97 50 L97 54 C97 57, 95 59, 92 59 L76 59" fill="#B4B4BA" stroke="#A1A1AA" stroke-width="1.5"/>
        <ellipse cx="10" cy="52" rx="4" ry="6" fill="#71717A"/>
        <line x1="28" y1="40" x2="28" y2="64" stroke="#E8E8EC" stroke-width="1.5" opacity="0.5"/>
        <line x1="62" y1="40" x2="62" y2="64" stroke="#E8E8EC" stroke-width="1.5" opacity="0.5"/>
        <ellipse cx="39" cy="51" rx="8" ry="9" fill="white"/>
        <circle cx="41" cy="51" r="5" fill="#1a1a1a"/>
        <circle cx="42.5" cy="49" r="2" fill="white"/>
        <ellipse cx="55" cy="51" rx="8" ry="9" fill="white"/>
        <circle cx="57" cy="51" r="5" fill="#1a1a1a"/>
        <circle cx="58.5" cy="49" r="2" fill="white"/>
      </svg>
      <h1>Prompt Coach</h1>
      <p class="tagline">Your AI prompting sideline coach</p>
    </div>

    <div class="card">
      <label for="provider">Mode</label>
      <select id="provider">
        <option value="demo">Demo Mode (no API key needed)</option>
        <option value="openai">OpenAI (GPT-4o-mini)</option>
        <option value="anthropic">Anthropic (Claude Sonnet)</option>
      </select>

      <div id="apiSection" style="display:none">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-… or sk-ant-…">
        <p class="hint">Stored locally. Never leaves your machine.</p>
      </div>

      <button id="save" class="btn-primary">Save Settings</button>
      <div id="status" class="status" role="status"></div>
    </div>

    <div class="card how">
      <h2>How to Use</h2>
      <div class="row">
        <kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>P</kbd>
        <span class="desc">Activate the coach</span>
      </div>
      <div class="row">
        <span class="icon">🏟</span>
        <span class="desc">Or click the whistle near any prompt field</span>
      </div>
    </div>

    <div class="card">
      <h2>Supported Platforms</h2>
      <div class="chips">
        <span class="chip">ChatGPT</span>
        <span class="chip">Claude</span>
        <span class="chip">Gemini</span>
        <span class="chip">Perplexity</span>
        <span class="chip">Copilot</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
