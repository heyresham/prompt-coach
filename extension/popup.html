<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="hero">
      <svg class="hero-whistle" width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M56 18 C62 4, 74 4, 70 18" stroke="#1a1a1a" fill="none" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M56 18 C62 4, 74 4, 70 18" stroke="#333" fill="none" stroke-width="2" stroke-linecap="round"/>
        <circle cx="63" cy="14" r="4.5" fill="none" stroke="#bbb" stroke-width="2.5"/>
        <path d="M10 38 C6 38, 4 43, 4 50 C4 57, 6 62, 10 62 L66 62 C73 62, 78 58, 78 50 C78 42, 73 38, 66 38 Z" fill="#D4A017" stroke="#B8860B" stroke-width="1.5"/>
        <path d="M10 38 C6 38, 4 43, 4 50 L66 50 C73 50, 78 46, 78 42 C78 40, 73 38, 66 38 Z" fill="#E5C73A" opacity=".3"/>
        <line x1="26" y1="38" x2="26" y2="62" stroke="#B8860B" stroke-width="1.5" opacity=".5"/>
        <line x1="60" y1="38" x2="60" y2="62" stroke="#B8860B" stroke-width="1.5" opacity=".5"/>
        <path d="M75 43 L90 43 C93 43, 96 45, 96 48 L96 52 C96 55, 93 57, 90 57 L75 57" fill="#C9A029" stroke="#B8860B" stroke-width="1.5"/>
        <rect x="94" y="46" width="4" height="8" rx="2" fill="#B8860B"/>
        <ellipse cx="8" cy="50" rx="3.5" ry="5.5" fill="#5a4a10"/>
        <ellipse cx="40" cy="49" rx="8" ry="9" fill="white"/>
        <circle cx="42" cy="49" r="5" fill="#1a1a1a"/>
        <circle cx="43.5" cy="47" r="2" fill="white"/>
        <ellipse cx="54" cy="49" rx="8" ry="9" fill="white"/>
        <circle cx="56" cy="49" r="5" fill="#1a1a1a"/>
        <circle cx="57.5" cy="47" r="2" fill="white"/>
      </svg>
      <h1>Prompt Coach</h1>
      <p class="tagline">Your AI prompting sideline coach</p>
    </div>

    <div class="card">
      <label for="provider">Mode</label>
      <select id="provider">
        <option value="demo">Demo Mode (no API key needed)</option>
        <option value="openai">OpenAI (GPT-4o-mini)</option>
        <option value="anthropic">Anthropic (Claude Sonnet)</option>
      </select>

      <div id="apiSection" style="display:none">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-… or sk-ant-…">
        <p class="hint">Stored locally. Never leaves your machine.</p>
      </div>

      <button id="save" class="btn-primary">Save Settings</button>
      <div id="status" class="status" role="status"></div>
    </div>

    <div class="card how">
      <h2>How to Use</h2>
      <div class="row">
        <kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>P</kbd>
        <span class="desc">Activate the coach</span>
      </div>
      <div class="row">
        <span class="icon">🏟</span>
        <span class="desc">Or click the whistle near any prompt field</span>
      </div>
    </div>

    <div class="card">
      <h2>Supported Platforms</h2>
      <div class="chips">
        <span class="chip">ChatGPT</span>
        <span class="chip">Claude</span>
        <span class="chip">Gemini</span>
        <span class="chip">Perplexity</span>
        <span class="chip">Copilot</span>
      </div>
    </div>

    <div class="card">
      <button id="resetOnboarding" class="btn-secondary">Replay Onboarding Tour</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
